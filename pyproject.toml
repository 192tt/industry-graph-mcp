[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-graph-mcp"
version = "0.5.0"
description = "Local industry knowledge-graph MCP with optional Neo4j or SQLite backend"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Industry Graph MCP" }]
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "ddgs>=9.0.0",
  "trafilatura>=1.12.0",
  "neo4j>=5.14.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
industry-graph-mcp = "industry_graph_mcp.__main__:main"
industry-graph-setup = "industry_graph_mcp.setup_wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
industry_graph_mcp = ["graph/viewer/*"]
